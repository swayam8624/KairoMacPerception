name: KairoCompanion
options:
  minimumXcodeGenVersion: 2.46.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  KairoCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CompanionApp
      - path: Sources/KairoControlProtocol
    info:
      path: CompanionApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kairo.Companion
        PRODUCT_NAME: Kairo Companion
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
